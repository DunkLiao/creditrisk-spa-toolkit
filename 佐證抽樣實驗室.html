<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>佐證抽樣實驗室 V3</title>
<style>
/* ===== 主題：改這幾個變數即可換色 ===== */
:root{
  --primary:#8a1538; --primary-d:#6b0f2b; --accent:#c9a24b; --accent-l:#f6edd8;
  --bg:#f6f4f2; --card:#fff; --text:#2b2b2b; --muted:#777; --line:#e3dfdb;
  --ok:#2e7d32; --warn:#b26a00; --err:#c62828; --radius:10px;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;background:var(--primary);color:#fff;box-shadow:0 2px 6px #0003}
.topbar h1{font-size:17px;margin:0 12px 0 0;white-space:nowrap}
.topbar h1 small{font-size:11px;font-weight:normal;background:var(--accent);color:#fff;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.topbar .sp{flex:1}
.layout{display:flex;min-height:calc(100vh - 52px)}
nav.side{width:190px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 0}
nav.side .grp{font-size:12px;color:var(--muted);padding:12px 18px 4px}
nav.side a{display:block;padding:8px 18px;color:var(--text);text-decoration:none;border-left:3px solid transparent}
nav.side a:hover{background:var(--accent-l)}
nav.side a.on{border-left-color:var(--accent);background:var(--accent-l);color:var(--primary);font-weight:bold}
main{flex:1;padding:18px 22px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px;color:var(--primary);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.card h3{font-size:14px;margin:14px 0 8px;color:var(--primary-d)}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-d)}
.btn.gold{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--err);border-color:#e9b4b4}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.topbar .btn{background:transparent;color:#fff;border-color:#ffffff55}
.topbar .btn:hover{background:#ffffff22}
table.grid{width:100%;border-collapse:collapse}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.grid th{background:#faf7f2;color:var(--primary-d);font-weight:600;cursor:default;white-space:nowrap}
table.grid th[data-sort]{cursor:pointer}
table.grid tr:hover td{background:#fdfbf7}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eee;white-space:nowrap}
.tag.ok{background:#e6f4ea;color:var(--ok)}.tag.warn{background:#fff4e0;color:var(--warn)}.tag.err{background:#fdecea;color:var(--err)}.tag.gold{background:var(--accent-l);color:#7a5c14}.tag.pri{background:#f7e3ea;color:var(--primary)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--radius);padding:12px 14px}
.stat .v{font-size:26px;font-weight:bold;color:var(--primary)}
.stat .l{color:var(--muted);font-size:12px}
.stat.bad{border-top-color:var(--err)}.stat.bad .v{color:var(--err)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea,input.inp,select.inp{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin:2px 0 8px}
.empty{text-align:center;color:var(--muted);padding:30px}
.warnbox{background:#fff4e0;border:1px solid #f0cf99;color:#7a4a00;border-radius:8px;padding:8px 12px;margin:8px 0}
.errbox{background:#fdecea;border:1px solid #e9b4b4;color:var(--err);border-radius:8px;padding:8px 12px;margin:8px 0}
.okbox{background:#e6f4ea;border:1px solid #b9dcbf;color:var(--ok);border-radius:8px;padding:8px 12px;margin:8px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
table.kv{border-collapse:collapse;width:100%}
table.kv th{width:130px;text-align:left;color:var(--muted);font-weight:normal;padding:4px 8px 4px 0;vertical-align:top}
table.kv td{padding:4px 0;word-break:break-all}
.mono{font-family:Consolas,monospace;font-size:12px}
.help h3{margin-top:18px}.help li{margin:4px 0}.help table{border-collapse:collapse;margin:8px 0}.help td,.help th{border:1px solid var(--line);padding:5px 9px;text-align:left}.help th{background:#faf7f2}
/* modal */
.mask{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:var(--radius);width:min(600px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 40px #0005}
.modal header{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:bold;color:var(--primary);display:flex}
.modal header .x{margin-left:auto;cursor:pointer;border:0;background:none;font-size:18px}
.modal .body{padding:16px;overflow:auto}
.modal footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
#toast div{background:#333;color:#fff;padding:9px 14px;border-radius:6px;box-shadow:0 3px 10px #0004;animation:fi .2s;max-width:420px}
#toast div.err{background:var(--err)}#toast div.ok{background:var(--ok)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
#print-area{display:none}
@media (max-width:820px){
  .layout{flex-direction:column}
  nav.side{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:4px}
  nav.side .grp{display:none}
  nav.side a{border-left:0;border-bottom:3px solid transparent;padding:6px 10px}
  nav.side a.on{border-bottom-color:var(--accent)}
  main{padding:12px}
}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block;font-size:12px}
  #print-area h1{color:var(--primary)}
  #print-area h2{color:var(--primary);font-size:15px;margin:14px 0 6px}
  #print-area table{width:100%;border-collapse:collapse;margin-bottom:8px}
  #print-area td,#print-area th{border:1px solid #999;padding:3px 5px;text-align:left}
  #print-area th{background:#f3e9ec}
  #print-area .num{text-align:right}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div class="topbar">
  <h1>🧪 佐證抽樣實驗室<small>V3</small></h1>
  <span class="sp"></span>
  <button class="btn" id="tb-import">⤒ 匯入</button>
  <button class="btn" id="tb-export">⤓ 匯出</button>
  <button class="btn" id="tb-print">🖨 報告</button>
</div>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="app"><div class="empty">載入中…</div></main>
</div>
<div id="toast"></div>
<div id="print-area"></div>
<input type="file" id="file-import" accept=".json,application/json" hidden>
<script>
'use strict';
/* =====================================================================
 * 0. 設定區（沿用 V1／V2 的資料庫名稱與版本，舊資料可直接在 V3 使用）
 * ===================================================================*/
const APP = { name: '佐證抽樣實驗室', dbName: 'bot-sample-lab', dbVersion: 1, filePrefix: '佐證抽樣實驗室' };
const SCHEMA = {
  meta:        { keyPath: 'key' },
  populations: { keyPath: 'id', indexes: { byPeriod: 'period', byCreated: 'createdAt' } },
  popRows:     { keyPath: 'id', indexes: { byPop: 'popId', byPopKey: ['popId', 'key'] } },
  plans:       { keyPath: 'id', indexes: { byPop: 'popId' } },
  runs:        { keyPath: 'id', indexes: { byPlan: 'planId', byPop: 'popId' } },
  samples:     { keyPath: 'id', indexes: { byRun: 'runId', byStatus: 'status', byRunRole: ['runId', 'role'] } },
  attachments: { keyPath: 'id', indexes: { bySample: 'sampleId' } }
};
const DATA_STORES = ['populations', 'popRows', 'plans', 'runs', 'samples', 'attachments'];
const METHODS = { srs: '簡單隨機', sys: '系統抽樣', strat: '分層抽樣', mus: '金額單位抽樣（MUS）', risk: '風險加權隨機', keyplus: '高額全查＋其餘抽樣' };
const ALLOC = { prop: '比例配置', equal: '等額配置', neyman: 'Neyman 配置（依金額標準差）' };
const METHOD_DESC = {
  srs: '以種子亂數對母體做 Fisher–Yates 洗牌，取前 n 筆為正選，接著 m 筆為預備。每筆被抽中的機率相同。',
  sys: '母體先依鍵值排序（確保可重現），間距 k = N / n，以亂數決定起點，之後每隔 k 筆抽一筆；預備樣本由未入選項目以簡單隨機抽出。',
  strat: '依「分層」欄位分組，依配置方式（比例／等額／Neyman）決定各層樣本數，每層設有最低抽樣數；小數以最大餘數法分配，層內再以簡單隨機抽取。',
  mus: '依累計金額抽樣，間距 J = 金額總額 / n；金額大於或等於 J 的項目自動列為全查，並重新計算剩餘間距，其餘以隨機起點每隔 J 取一個命中點。金額以絕對值計算，金額為 0 的項目不會被抽中。',
  risk: '採 Efraimidis–Spirakis 加權隨機抽樣：每筆計算 u^(1/w)（u 為 0–1 亂數、w 為風險權重），取最大的 n 筆，風險愈高愈容易入選。',
  keyplus: '金額大於或等於門檻的項目全部檢查（全查），其餘項目再套用所選的抽樣方法抽出 n 筆（此處 n 為「其餘項目」的抽樣數）。'
};
const ST_ORDER = ['待調閱', '已取得', '已查核', '無法取得', '已替補', '備用'];

/* =====================================================================
 * 1. IndexedDB 封裝
 * ===================================================================*/
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('此瀏覽器不支援 IndexedDB'));
      const rq = indexedDB.open(APP.dbName, APP.dbVersion);
      rq.onupgradeneeded = () => {
        const db = rq.result, tx = rq.transaction;
        for (const [name, def] of Object.entries(SCHEMA)) {
          const os = db.objectStoreNames.contains(name) ? tx.objectStore(name) : db.createObjectStore(name, { keyPath: def.keyPath });
          for (const [ix, path] of Object.entries(def.indexes || {})) if (!os.indexNames.contains(ix)) os.createIndex(ix, path);
        }
      };
      rq.onsuccess = () => { this.db = rq.result; this.db.onversionchange = () => { this.db.close(); toast('資料庫已在其他分頁更新，請重新整理', 'err'); }; res(this.db); };
      rq.onerror = () => rej(rq.error);
      rq.onblocked = () => toast('請關閉本工具的其他分頁後重新整理', 'err');
    });
  },
  _p: rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }),
  store(name, mode = 'readonly') { return this.db.transaction(name, mode).objectStore(name); },
  get(s, k)         { return this._p(this.store(s).get(k)); },
  all(s)            { return this._p(this.store(s).getAll()); },
  byIndex(s, ix, v) { return this._p(this.store(s).index(ix).getAll(v)); },
  count(s)          { return this._p(this.store(s).count()); },
  put(s, v)         { return this._p(this.store(s, 'readwrite').put(v)); },
  del(s, k)         { return this._p(this.store(s, 'readwrite').delete(k)); },
  clear(s)          { return this._p(this.store(s, 'readwrite').clear()); },
  countBy(s, ix) {
    return new Promise((res, rej) => {
      const out = {}, rq = this.store(s).index(ix).openKeyCursor();
      rq.onsuccess = () => { const c = rq.result; if (!c) return res(out); out[c.key] = (out[c.key] || 0) + 1; c.continue(); };
      rq.onerror = () => rej(rq.error);
    });
  },
  tx(stores, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(stores, 'readwrite');
      let out; try { out = fn(t); } catch (e) { t.abort(); return rej(e); }
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('交易中止'));
    });
  },
  async putMany(s, arr) { return this.tx([s], t => { const os = t.objectStore(s); arr.forEach(v => os.put(v)); }); }
};
const Meta = {
  async get(k, d = null) { const r = await DB.get('meta', k); return r ? r.value : d; },
  set(k, v) { return DB.put('meta', { key: k, value: v }); }
};

/* =====================================================================
 * 2. 共用工具
 * ===================================================================*/
const $ = (s, el = document) => el.querySelector(s);
let _uc = 0;
const uid = () => Date.now().toString(36) + (++_uc).toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => new Date().toISOString();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (n, d = 0) => (n == null || n === '' || isNaN(n)) ? '' : Number(n).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtD = iso => iso ? new Date(iso).toLocaleString('zh-TW', { hourCycle: 'h23' }) : '';
const fmtP = (x, d = 1) => (x == null || isNaN(x)) ? '' : (x * 100).toFixed(d) + '%';
const today = () => { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; };
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayISO = () => isoDate(new Date());
const addDays = (n, from = new Date()) => { const d = new Date(from); d.setDate(d.getDate() + n); return isoDate(d); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const safeName = s => String(s).replace(/[\\/:*?"<>|]/g, '_');
const sum = a => a.reduce((s, x) => s + x, 0);
const maxOf = a => a.length ? a.reduce((m, x) => x > m ? x : m, -Infinity) : 0;
const minOf = a => a.length ? a.reduce((m, x) => x < m ? x : m, Infinity) : 0;
const stdev = a => { if (a.length < 2) return 0; const m = sum(a) / a.length; return Math.sqrt(sum(a.map(x => (x - m) ** 2)) / (a.length - 1)); };
const median = a => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const sv = v => { const s = String(v ?? '').trim(); return s || '(空白)'; };
function groupBy(rows, f) { const m = new Map(); rows.forEach(r => { const k = f(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }); return m; }
function toast(msg, type = '') {
  const d = document.createElement('div'); d.className = type; d.textContent = msg;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), type === 'err' ? 5000 : 2500);
}
function modal({ title, body, ok = '確定', cancel = '取消', onOk, wide }) {
  return new Promise(resolve => {
    const m = document.createElement('div'); m.className = 'mask';
    m.innerHTML = `<div class="modal" style="${wide ? 'width:min(920px,96vw)' : ''}"><header>${esc(title)}<button class="x" title="關閉 (Esc)">✕</button></header>
      <div class="body"></div><footer>${cancel ? `<button class="btn" data-c>${esc(cancel)}</button>` : ''}<button class="btn pri" data-o>${esc(ok)}</button></footer></div>`;
    const b = $('.body', m); typeof body === 'string' ? (b.innerHTML = body) : b.appendChild(body);
    const close = v => { document.removeEventListener('keydown', onKey); m.remove(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape' && m === [...document.querySelectorAll('.mask')].pop()) close(false); };
    document.addEventListener('keydown', onKey);
    $('.x', m).onclick = () => close(false);
    const c = $('[data-c]', m); if (c) c.onclick = () => close(false);
    const ob = $('[data-o]', m);
    ob.onclick = async () => {
      if (ob.disabled) return; ob.disabled = true;
      try { if (onOk && (await onOk(b)) === false) { ob.disabled = false; return; } close(true); }
      catch (e) { ob.disabled = false; console.error(e); toast(e.message || String(e), 'err'); }
    };
    document.body.appendChild(m);
    const f = $('input,select,textarea', b); if (f) f.focus();
  });
}
const confirmBox = (msg, ok = '確定') => modal({ title: '確認', body: `<p>${esc(msg)}</p>`, ok });
function download(name, content, mime = 'application/octet-stream') {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = safeName(name);
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// CSV 公式注入防護：以 = + - @ 開頭的文字（非純數字）前面補單引號，避免 Excel 當公式執行
function toCSV(rows, cols) {
  const q = v => {
    v = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(v) && !/^[-+]?\d+(\.\d+)?([eE][-+]?\d+)?$/.test(v)) v = "'" + v;
    return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  };
  return '\uFEFF' + [cols.map(c => q(c.label)).join(','), ...rows.map(r => cols.map(c => q(typeof c.get === 'function' ? c.get(r) : r[c.key])).join(','))].join('\r\n');
}
function toExcelXML(sheets) {
  // 移除 XML 1.0 不允許的控制字元，否則含不可見字元的資料會讓 Excel 無法開啟
  const x = s => esc(String(s ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')).replace(/\n/g, '&#10;');
  const cell = v => (typeof v === 'number' && isFinite(v)) ? `<Cell><Data ss:Type="Number">${v}</Data></Cell>` : `<Cell><Data ss:Type="String">${x(v ?? '')}</Data></Cell>`;
  const ws = sheets.map(s => `<Worksheet ss:Name="${x(String(s.name).replace(/[\\/?*\[\]:]/g, '_').slice(0, 31))}"><Table>
<Row>${s.cols.map(c => `<Cell ss:StyleID="h"><Data ss:Type="String">${x(c.label)}</Data></Cell>`).join('')}</Row>
${s.rows.map(r => `<Row>${s.cols.map(c => cell(typeof c.get === 'function' ? c.get(r) : r[c.key])).join('')}</Row>`).join('\n')}
</Table></Worksheet>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#8A1538" ss:Pattern="Solid"/></Style></Styles>
${ws}</Workbook>`;
}
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const b64ToBlob = d => { const [h, b] = d.split(','), bin = atob(b), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: (h.match(/data:([^;]*)/) || [])[1] || '' }); };
const readTextSmart = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => {
    const buf = r.result;
    try { res(new TextDecoder('utf-8', { fatal: true }).decode(buf)); }
    catch { try { res(new TextDecoder('big5').decode(buf)); } catch (e) { rej(e); } }
  };
  r.onerror = rej; r.readAsArrayBuffer(f);
});
const readText = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f, 'utf-8'); });
function barChart(data, { width = 560, barH = 22, color = 'var(--primary)', fmt = v => fmtN(v) } = {}) {
  if (!data.length) return '<div class="empty">無資料</div>';

      <tbody>${show.map(r => `<tr data-id="${esc(r.id)}">${cfg.selectable ? `<td><input type="checkbox" data-sel="${esc(r.id)}" ${st.sel.has(r.id) ? 'checked' : ''}></td>` : ''}${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.html ? c.html(r) : esc(text(c, r))}</td>`).join('')}${cfg.actions ? `<td style="white-space:nowrap">${cfg.actions(r)}</td>` : ''}</tr>`).join('')}</tbody></table></div>

  const colOf = r => axis === 'risk' ? sv(r.risk) : sv(r.unit);
  const cnt = new Map(); rows.forEach(r => cnt.set(colOf(r), (cnt.get(colOf(r)) || 0) + 1));
  const topCols = new Set([...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12).map(e => e[0]));

  rows.forEach(r => { const x = cell(sn(r), cn(r)); x.N++; x.A += absA(r); if (weightOf(r, rw) >= hiW) x.hi++; });
  samples.filter(isCovered).forEach(s => { const x = cell(sn(s), cn(s)); x.n++; x.a += absA(s); });

  const names = k => [...new Set(list.map(x => x[k]))];

function parseTable(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/, 1)[0] || '', d = first.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"' && cur === '') q = true;
    else if (c === d) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
// [V3] 重寫金額解析：支援 科學記號、全形數字、括號負數、尾端負號、貨幣符號，
// 並修正「-$1,000」「-NT$1,000」（負號在貨幣符號前面）被誤判成正數的問題
function parseNum(v) {
  let s = String(v ?? '').normalize('NFKC').replace(/[−–—]/g, '-').replace(/[,\s]/g, '');
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/-$/.test(s)) { neg = !neg; s = s.slice(0, -1); }
  const m = s.match(/([+-]?)[^\d.+-]*(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+)/);
  if (!m) return NaN;
  const n = parseFloat(m[2]);
  return (m[1] === '-') !== neg ? -n : n;
}

  $('[name=file]', body).onchange = async e => { const f = e.target.files[0]; if (!f) return; $('[name=paste]', body).value = await readTextSmart(f); if (!$('[name=name]', body).value) $('[name=name]', body).value = f.name.replace(/\.[^.]+$/, ''); analyse(); };
  await modal({
    title: existing ? `重新匯入（覆蓋）：${existing.name}` : '匯入母體', body, ok: '匯入', wide: true,
    onOk: async root => {
      const v = n => root.querySelector(`[name=${n}]`).value.trim();
      if (!v('name')) { toast('請輸入母體名稱', 'err'); return false; }
      if (!table || table.length < 2) { toast('請先貼上資料或選擇檔案', 'err'); return false; }
      const head = table[0].map(x => String(x).trim()), fm = {};
      fields.forEach(([k]) => fm[k] = +root.querySelector(`[data-f=${k}]`).value);
      if (fm.key < 0 || fm.amount < 0) { toast('「鍵值」與「金額」必須對應欄位', 'err'); return false; }
      const popId = existing?.id || uid(), seen = new Map(); let bad = 0, dup = 0;

        let amount = parseNum(r[fm.amount]); if (isNaN(amount)) { amount = 0; bad++; }
        const g = k => fm[k] >= 0 ? String(r[fm[k]] ?? '').trim() : '';
        const data = {}; head.forEach((h, j) => data[h || '欄' + (j + 1)] = r[j] ?? '');
        return { id: `${popId}_${i + 1}`, popId, rowNo: i + 1, key, amount, stratum: g('stratum'), unit: g('unit'), risk: g('risk'), data };
      });
      const fp = popFingerprint(rows);
      if (existing && fp !== existing.fingerprint && !await confirmBox('⚠ 母體已變動（指紋不同）：依舊母體執行的抽樣將無法重現，且標示警告。仍要覆蓋嗎？', '覆蓋')) return false;
      const pop = { ...(existing || { id: popId, createdAt: now() }), name: v('name'), period: v('period'), sourceNote: v('src'), columns: head, fieldMap: Object.fromEntries(fields.map(([k]) => [k, fm[k] >= 0 ? head[fm[k]] : ''])), rowCount: rows.length, totalAmount: sum(rows.map(r => r.amount)), fingerprint: fp, updatedAt: now() };
      const oldIds = existing ? await keysBy('popRows', 'byPop', existing.id) : [];
      await DB.tx(['populations', 'popRows'], t => { oldIds.forEach(id => t.objectStore('popRows').delete(id)); rows.forEach(r => t.objectStore('popRows').put(r)); t.objectStore('populations').put(pop); });
      State.popId = pop.id; if (!existing) { State.planId = null; State.runId = null; }
      toast(`已匯入 ${fmtN(rows.length)} 筆${bad ? `；${bad} 筆金額無法解析（以 0 計）` : ''}${dup ? `；${dup} 筆鍵值重複（已加 #序號）` : ''}`, bad || dup ? '' : 'ok');
      refresh();
    }
  });
}

async function deletePop(pop) {
  const runs = await DB.byIndex('runs', 'byPop', pop.id), locked = runs.filter(r => r.locked).length;
  const msg = `確定刪除母體「${pop.name}」？將一併刪除 ${fmtN(pop.rowCount)} 筆明細、其計畫、${runs.length} 次抽樣紀錄、樣本與附件，無法復原。`;
  if (locked) {
    const ok = await modal({
      title: '⚠ 刪除含已鎖定抽樣的母體', ok: '刪除',
      body: `<p>${esc(msg)}</p><div class="errbox">其中 <b>${locked}</b> 次抽樣已鎖定（稽核證據）。建議先到「資料管理」匯出 JSON 備份。</div><div class="field"><label>請輸入「刪除」二字確認</label><input name="t"></div>`,

async function replaceSample(sid) {

function pickImport(mode) {
  const inp = $('#file-import'); inp.value = '';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await readText(f));
      if (!j.data || j.db !== APP.dbName) throw new Error('檔案格式不符（不是本工具匯出的 JSON）');
      if (mode === 'restore' && !await confirmBox('將先清空目前所有資料再匯入，確定？', '還原')) return;
      const rows = {};
      for (const s of DATA_STORES) {
        const arr = j.data[s] || [];
        if (!Array.isArray(arr)) throw new Error(`備份檔的「${s}」格式不正確`);
        rows[s] = arr.map(r => typeof r.blob === 'string' && r.blob.startsWith('data:') ? { ...r, blob: b64ToBlob(r.blob) } : r);
      }
      await DB.tx(DATA_STORES, t => DATA_STORES.forEach(s => { const os = t.objectStore(s); if (mode === 'restore') os.clear(); rows[s].forEach(r => os.put(r)); }));
      GS.track && GS.track.sel.clear();
      toast(`匯入完成：${DATA_STORES.map(s => `${s} ${rows[s].length}`).join('、')}`, 'ok'); refresh();
    } catch (e) { console.error(e); toast('匯入失敗：' + e.message, 'err'); }
  };
  inp.click();
}
async function loadSample() {

    let r = rng(), t = types[types.length - 1]; for (const x of types) { if (r < x[1]) { t = x; break; } r -= x[1]; }
    const amount = Math.max(1000, Math.round(Math.exp(t[2] + t[3] * gauss()) / 1000) * 1000), unit = units[Math.floor(rng() ** 1.4 * units.length)];
    const p = rng() + (amount > 1e7 ? .15 : 0), risk = p > .85 ? '高' : p > .5 ? '中' : '低', key = `LN-115-${String(i + 1).padStart(4, '0')}`;
    return { id: `${popId}_${i + 1}`, popId, rowNo: i + 1, key, amount, stratum: t[0], unit, risk, data: { 案號: key, 金額: amount, 產品別: t[0], 分行: unit, 風險等級: risk } };
  });

  const mkPlan = (name, method, n, m, seed, params = {}) => ({ id: uid(), popId, name, method, n, m, seed, note: '範例計畫', params: { ...defaultParams(), ...params }, createdAt: now(), updatedAt: now() });
  const plans = [
    mkPlan('範例：分層抽樣（比例配置）', 'strat', 40, 8, 'DEMO-2026', { allocation: 'prop', minPerStratum: 3 }),
    mkPlan('範例：金額單位抽樣 MUS', 'mus', 30, 5, 'DEMO-MUS'),
    mkPlan('範例：風險加權隨機', 'risk', 25, 5, 'DEMO-RISK'),
    mkPlan('範例：高額全查＋其餘隨機', 'keyplus', 20, 5, 'DEMO-KEY', { keyItemThreshold: th, baseMethod: 'srs' })
  ];

  const S = r1.samples, main = S.filter(s => s.role !== '預備'), res = S.filter(s => s.role === '預備');

      <li><b>佐證追蹤</b>：逐筆更新調閱狀態、上傳附件、填查核結果；無法取得時按「替補」由預備樣本遞補。</li></ol>
    <h3>二、抽樣方法</h3><table><tr><th>方法</th><th>說明</th></tr>
      ${Object.keys(METHODS).map(k => `<tr><td>${esc(METHODS[k])}</td><td>${esc(METHOD_DESC[k])}</td></tr>`).join('')}</table>
    <h3>三、可重現與防竄改</h3><ul>
      <li>亂數使用 xmur3＋mulberry32；母體依鍵值排序後再抽，因此「相同種子＋相同母體＋相同參數」永遠得到相同樣本，與匯入列順序無關。</li>
      <li>母體指紋＝SHA-256(依鍵值排序後的「鍵值＋金額」)；執行指紋＝SHA-256(母體指紋＋方法＋參數＋種子＋樣本清單)。</li>
      <li>「驗證重現」會以儲存的種子與參數重新抽樣並比對；若母體被「重新匯入（覆蓋）」而指紋改變，系統會警示「母體已變動，無法重現原抽樣」。母體指紋只涵蓋鍵值與金額，若事後改了分層／單位／風險欄位，「驗證重現」會顯示結果不同。</li>
      <li>已鎖定的抽樣結果不能刪除或重抽；若需重抽，請修改種子後另建一次新的抽樣。刪除含已鎖定抽樣的母體需輸入「刪除」二字確認。</li></ul>
    <h3>四、樣本數試算</h3><ul><li>屬性抽樣（預期零誤差）：n = ⌈ ln(1−信賴水準) ／ ln(1−可容忍偏差率) ⌉，例如 95%、5% → 59。</li>
      <li>金額單位抽樣：n = ⌈ 母體總額 × 信賴係數 ／ 可容忍誤述 ⌉（係數 90%＝2.31、95%＝3.0、99%＝4.61）。</li></ul>
    <h3>五、樣本狀態與替補</h3><p>待調閱 → 已取得 → 已查核（正常／異常）；或 待調閱 → 無法取得 → 已替補。預備樣本平時為「備用」，替補後轉為「待調閱」，並在匯出的 Excel 底稿中改列於「正選樣本」表（標示「替補 #n」）；「預備樣本」表只列尚未啟用者。替補優先使用同層預備樣本，並記錄原因與時間。</p>
    <h3>六、匯出注意事項</h3><ul>
      <li><b>CSV</b> 以 Excel 開啟時，前面有 0 的鍵值（例：00123）或超過 15 位的數字會被轉成數字；需要保留原樣請使用「Excel」匯出（.xls）。</li>
      <li>以 = + - @ 開頭的文字在 CSV 中會自動加上單引號，避免被當成公式執行。</li>
      <li>母體清單匯出的「母體指紋」是完整 64 碼，畫面上只顯示前 12 碼。</li></ul>
    <h3>七、常見問題</h3><ul>
      <li><b>金額為負數或 0？</b>MUS 以絕對值計算，金額為 0 的項目不會被 MUS 抽中，執行時會提示。金額可寫成 -1,000、(1,000)、1,000-、-$1,000、1.2E+6 等格式。</li>
      <li><b>分層抽樣的總數比 n 多？</b>每層最低抽樣數優先配置，若所有層的最低數相加超過 n，總數會大於 n。</li>
      <li><b>鍵值重複？</b>匯入時會自動加上 #2、#3 後綴並提醒。</li>
      <li><b>資料會不會不見？</b>清除瀏覽器網站資料或使用無痕模式會遺失，請定期於「資料管理」匯出 JSON 備份。</li></ul>
    <h3>八、修正紀錄</h3><p><b>V3</b></p><ul>
      <li>修正：金額「-$1,000」「-NT$1,000」（負號在貨幣符號前）被誤判為正數。</li>
      <li>修正：清單表頭的「全選」勾選框無法再按一次取消全選。</li>
      <li>修正：刪除抽樣紀錄後，畫面會誤跳到另一個計畫；同一計畫還有其他抽樣時，下拉選單與畫面不一致。</li>
      <li>修正：替補上場的預備樣本在 Excel 底稿與列印報告中被列在「預備樣本」，正選樣本表不完整；現已改列正選並加「替補關係」欄。</li>
      <li>修正：母體清單匯出的指紋被截成 12 碼，現匯出完整 64 碼。</li>
      <li>安全：備份檔內的編號（樣本、附件）插入畫面前一律跳脫，避免被竄改的 JSON 造成 HTML 注入；匯入時也會檢查各資料表是否為陣列。</li>
      <li>改善：文字欄位排序改為自然排序（K2 排在 K10 之前）。</li></ul>
    <p><b>V2</b></p><ul>
      <li>修正：10 萬筆以上母體開啟「母體管理」當掉；覆蓋地圖／佐證追蹤誤報「尚無抽樣紀錄」；對話框確定鍵可連點；批次設定誤改被篩選隱藏的樣本；快速切頁畫面錯亂；涵蓋率不隨替補更新；工具列列印找不到抽樣。</li>
      <li>強化：CSV 公式注入防護、Excel 匯出移除非法控制字元、刪除含鎖定抽樣的母體需二次確認、MUS／風險加權抽不滿 n 筆時提示。</li></ul></div>`;
}

/* =====================================================================
 * 15. 啟動
 * ===================================================================*/
(async function boot() {
  try { await DB.open(); }
  catch (e) {
    $('#app').innerHTML = `<div class="card"><h2>無法開啟 IndexedDB</h2><p>${esc(e.message || e)}</p><p>請勿使用無痕（InPrivate）模式，或洽資訊人員確認瀏覽器是否封鎖本機儲存。</p></div>`;
    return;
  }
  try { await navigator.storage?.persist?.(); } catch { }
  const sel = await Meta.get('sel'); if (sel) { State.popId = sel.popId; State.planId = sel.planId; State.runId = sel.runId; }
  $('#tb-import').onclick = () => pickImport('merge');
  $('#tb-export').onclick = exportAll;
  $('#tb-print').onclick = () => printReport();
  const last = location.hash.slice(1) || await Meta.get('lastPage', 'dash');
  if (location.hash.slice(1) !== last) location.hash = last; else go(last);
})();
window.addEventListener('error', e => toast('錯誤：' + e.message, 'err'));
window.addEventListener('unhandledrejection', e => toast('錯誤：' + (e.reason?.message || e.reason), 'err'));
</script>
