<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>佐證鏈稽核工作室</title>
<style>
/* ===== 主題：改這幾個變數即可換色 ===== */
:root{
  --primary:#8a1538; --primary-d:#6b0f2b; --accent:#c9a24b; --accent-l:#f6edd8;
  --bg:#f6f4f2; --card:#fff; --text:#2b2b2b; --muted:#777; --line:#e3dfdb;
  --ok:#2e7d32; --warn:#b26a00; --err:#c62828; --radius:10px;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;background:var(--primary);color:#fff;box-shadow:0 2px 6px #0003}
.topbar h1{font-size:17px;margin:0 12px 0 0;white-space:nowrap}
.topbar .sp{flex:1}
.topbar select{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:6px;padding:5px 8px;max-width:300px}
.topbar select option{color:#222}
.layout{display:flex;min-height:calc(100vh - 52px)}
nav.side{width:200px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 0}
nav.side .grp{font-size:12px;color:var(--muted);padding:12px 18px 4px}
nav.side a{display:block;padding:8px 18px;color:var(--text);text-decoration:none;border-left:3px solid transparent}
nav.side a:hover{background:var(--accent-l)}
nav.side a.on{border-left-color:var(--accent);background:var(--accent-l);color:var(--primary);font-weight:bold}
main{flex:1;padding:18px 22px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px;color:var(--primary);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.card h3{font-size:14px;margin:14px 0 6px;color:var(--primary-d)}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-d)}
.btn.gold{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--err);border-color:#e9b4b4}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.topbar .btn{background:transparent;color:#fff;border-color:#ffffff55}
.topbar .btn:hover{background:#ffffff22}
table.grid{width:100%;border-collapse:collapse}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.grid th{background:#faf7f2;color:var(--primary-d);font-weight:600;cursor:default;white-space:nowrap}
table.grid th[data-sort]{cursor:pointer}
table.grid tr:hover td{background:#fdfbf7}
table.grid tr.sel td{background:var(--accent-l)}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eee;white-space:nowrap}
.tag.ok{background:#e6f4ea;color:var(--ok)}.tag.warn{background:#fff4e0;color:var(--warn)}.tag.err{background:#fdecea;color:var(--err)}.tag.gold{background:var(--accent-l);color:#7a5a10}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--radius);padding:12px 14px}
.stat.bad{border-top-color:var(--err)}
.stat .v{font-size:26px;font-weight:bold;color:var(--primary)}
.stat.bad .v{color:var(--err)}
.stat .l{color:var(--muted);font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea,input.inp,select.inp{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.empty{text-align:center;color:var(--muted);padding:30px}
.muted{color:var(--muted)}
.mono{font-family:Consolas,monospace}
/* modal */
.mask{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:var(--radius);width:min(560px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 40px #0005}
.modal header{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:bold;color:var(--primary);display:flex}
.modal header .x{margin-left:auto;cursor:pointer;border:0;background:none;font-size:18px}
.modal .body{padding:16px;overflow:auto}
.modal footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
#toast div{background:#333;color:#fff;padding:9px 14px;border-radius:6px;box-shadow:0 3px 10px #0004;animation:fi .2s;max-width:420px}
#toast div.err{background:var(--err)}#toast div.ok{background:var(--ok)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
/* 節點工作台 */
.wb{display:grid;grid-template-columns:270px minmax(0,1fr) 310px;gap:14px;align-items:start}
.wb .card{margin-bottom:0}
.nlist{max-height:68vh;overflow:auto;margin:0 -6px}
.nitem{display:flex;gap:6px;align-items:center;padding:6px;border-radius:6px;cursor:pointer;border-left:3px solid transparent}
.nitem:hover{background:var(--accent-l)}
.nitem.on{background:var(--accent-l);border-left-color:var(--primary)}
.nitem .cd{font-family:Consolas,monospace;font-size:12px;color:var(--muted);min-width:28px}
.nitem .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:2px 9px;font-size:12px;cursor:pointer}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.issue{display:flex;gap:6px;padding:5px 8px;border-radius:6px;margin-bottom:4px;font-size:13px}
.issue.err{background:#fdecea;color:var(--err)}.issue.warn{background:#fff4e0;color:var(--warn)}.issue.ok{background:#e6f4ea;color:var(--ok)}
.lk{display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.lk .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.lk .tt:hover{color:var(--primary);text-decoration:underline}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.form2 .full{grid-column:1/-1}
/* 地圖 */
.map-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;max-height:72vh}
.map-wrap svg{display:block}
.mnode{cursor:pointer}
.mnode.dim,.edge.dim,.stub.dim{opacity:.18}
.mnode:hover rect.bx{filter:brightness(.96)}
.edge{fill:none;stroke:#a89f98;stroke-width:1.5}
.edge.hl{stroke:#8a1538;stroke-width:2.6}
.edge.hl2{stroke:#1565c0;stroke-width:2.2}
.stub{stroke:#c62828;stroke-width:2;stroke-dasharray:5 4}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.formula-chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:2px;font-size:12px;cursor:pointer;background:#fafafa}
.formula-chip:hover{border-color:var(--accent)}
pre.letter{white-space:pre-wrap;background:#faf7f2;border:1px solid var(--line);border-radius:6px;padding:10px;font-family:inherit;max-height:50vh;overflow:auto}
.rpt h1{color:var(--primary);font-size:20px;margin:0 0 8px}
.rpt h2{color:var(--primary-d);font-size:15px;border-bottom:2px solid var(--accent);padding-bottom:3px;margin:16px 0 8px}
.rpt table{width:100%;border-collapse:collapse;margin-bottom:8px}
.rpt td,.rpt th{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top;font-size:12px}
.rpt th{background:#f3ece0}
@media (max-width:1100px){.wb{grid-template-columns:1fr}}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print-area .rpt h2{break-after:avoid}
  #print-area .rpt table{break-inside:auto}
  #print-area .rpt tr{break-inside:avoid}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div class="topbar">
  <h1>🔗 佐證鏈稽核工作室</h1>
  <label style="font-size:12px;opacity:.85">當前案件</label>
  <select id="case-sel" title="切換當前案件"></select>
  <span class="sp"></span>
  <button class="btn" id="tb-import">⤒ 匯入</button>
  <button class="btn" id="tb-export">⤓ 匯出</button>
  <button class="btn" id="tb-print">🖨 報告</button>
</div>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="app"><div class="empty">載入中…</div></main>
</div>
<div id="toast"></div>
<div id="print-area"></div>
<input type="file" id="file-import" accept=".json,application/json" hidden>
<input type="file" id="file-csv" accept=".csv,.tsv,.txt,text/csv,text/plain" hidden>
<script>
'use strict';
/* =====================================================================
 * 0. 設定區
 * ===================================================================*/
const APP = {
  name: '佐證鏈稽核工作室',
  dbName: 'bot-evidence-chain',
  dbVersion: 1,
  filePrefix: '佐證鏈稽核工作室',
  maxAttach: 25 * 1048576
};
const SCHEMA = {
  meta:        { keyPath: 'key' },
  cases:       { keyPath: 'id', indexes: { byStatus: 'status', byDue: 'dueDate' } },
  nodes:       { keyPath: 'id', indexes: { byCase: 'caseId', byType: 'type', byCaseType: ['caseId', 'type'] } },
  links:       { keyPath: 'id', indexes: { byCase: 'caseId', byFrom: 'fromId', byTo: 'toId' } },
  datasets:    { keyPath: 'id', indexes: { byCase: 'caseId' } },
  reviews:     { keyPath: 'id', indexes: { byNode: 'nodeId', byCase: 'caseId' } },
  attachments: { keyPath: 'id', indexes: { byNode: 'nodeId', byCase: 'caseId' } }
};
const DATA_STORES = ['cases', 'nodes', 'links', 'datasets', 'reviews', 'attachments'];

const TYPES = {
  claim:    { label: '結論', icon: '🎯', color: '#8a1538', bg: '#fbeef2', prefix: 'C', order: 0 },
  number:   { label: '數字', icon: '🔢', color: '#b26a00', bg: '#fff6e5', prefix: 'N', order: 1 },
  calc:     { label: '計算', icon: '⚙️', color: '#1565c0', bg: '#e8f1fb', prefix: 'K', order: 2 },
  data:     { label: '資料', icon: '📊', color: '#2e7d32', bg: '#e9f6ea', prefix: 'D', order: 3 },
  evidence: { label: '佐證', icon: '📎', color: '#6a4c93', bg: '#f1ecf8', prefix: 'E', order: 4 }
};
const REL = { references: '引用', derived_from: '推導自', supported_by: '佐證自' };
const RSTAT = { unreviewed: ['未覆核', ''], pass: ['通過', 'ok'], fix: ['需補件', 'warn'], reject: ['退回', 'err'] };
const CASE_STATUS = ['規劃中', '進行中', '覆核中', '已結案'];
const RULES = {
  R0: { label: '結論無佐證鏈', level: 'err' },
  R1: { label: '無來源數字', level: 'err' },
  R2: { label: '核驗不符', level: 'err' },
  R3: { label: '空佐證', level: 'warn' },
  R4: { label: '孤立節點', level: 'warn' },
  R5: { label: '需重新覆核', level: 'warn' },
  R6: { label: '循環引用', level: 'err' },
  RV: { label: '覆核退回／需補件', level: 'err' }
};
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

/* =====================================================================
 * 1. IndexedDB 封裝
 * ===================================================================*/
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('此瀏覽器不支援 IndexedDB'));
      const rq = indexedDB.open(APP.dbName, APP.dbVersion);
      rq.onupgradeneeded = () => {
        const db = rq.result, tx = rq.transaction;
        for (const [name, def] of Object.entries(SCHEMA)) {
          const os = db.objectStoreNames.contains(name) ? tx.objectStore(name)
                   : db.createObjectStore(name, { keyPath: def.keyPath });
          for (const [ix, path] of Object.entries(def.indexes || {}))
            if (!os.indexNames.contains(ix)) os.createIndex(ix, path);
        }
      };
      rq.onsuccess = () => { this.db = rq.result; this.db.onversionchange = () => { this.db.close(); toast('資料庫已在其他分頁更新，請重新整理', 'err'); }; res(this.db); };
      rq.onerror = () => rej(rq.error);
      rq.onblocked = () => toast('請關閉本工具的其他分頁後重新整理', 'err');
    });
  },
  _p: rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }),
  store(name, mode = 'readonly') { return this.db.transaction(name, mode).objectStore(name); },
  get(s, k)         { return this._p(this.store(s).get(k)); },
  all(s)            { return this._p(this.store(s).getAll()); },
  byIndex(s, ix, v) { return this._p(this.store(s).index(ix).getAll(v)); },
  count(s)          { return this._p(this.store(s).count()); },
  put(s, v)         { return this._p(this.store(s, 'readwrite').put(v)); },
  del(s, k)         { return this._p(this.store(s, 'readwrite').delete(k)); },
  clear(s)          { return this._p(this.store(s, 'readwrite').clear()); },
  tx(stores, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(stores, 'readwrite');
      let out; try { out = fn(t); } catch (e) { t.abort(); return rej(e); }
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('交易中止'));
    });
  },
  async putMany(s, arr) { return this.tx([s], t => { const os = t.objectStore(s); arr.forEach(v => os.put(v)); }); }
};
const Meta = {
  async get(k, d = null) { const r = await DB.get('meta', k); return r ? r.value : d; },
  set(k, v) { return DB.put('meta', { key: k, value: v }); }
};

/* =====================================================================
 * 2. 共用工具
 * ===================================================================*/
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => new Date().toISOString();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (n, d = 0) => (n == null || n === '' || isNaN(n)) ? '' : Number(n).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtV = n => (n == null || n === '' || isNaN(n)) ? '' : Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 6 });
const fmtD = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleString('zh-TW', { hourCycle: 'h23' }); };
const fmtROC = d => { if (!d) return ''; const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${+m[1] - 1911}年${+m[2]}月${+m[3]}日` : d; };
const today = () => { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; };
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const safeName = s => String(s).replace(/[\\/:*?"<>|]/g, '_');
const trunc = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function toast(msg, type = '') {
  const d = document.createElement('div'); d.className = type; d.textContent = msg;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), type === 'err' ? 5000 : 2800);
}
function modal({ title, body, ok = '確定', cancel = '取消', onOk, wide }) {
  return new Promise(resolve => {
    const m = document.createElement('div'); m.className = 'mask';
    m.innerHTML = `<div class="modal" style="${wide ? 'width:min(960px,96vw)' : ''}"><header>${esc(title)}<button class="x" title="關閉 (Esc)">✕</button></header>
      <div class="body"></div><footer>${cancel ? `<button class="btn" data-c>${esc(cancel)}</button>` : ''}${ok ? `<button class="btn pri" data-o>${esc(ok)}</button>` : ''}</footer></div>`;
    const b = $('.body', m); typeof body === 'string' ? (b.innerHTML = body) : b.appendChild(body);
    const close = v => { document.removeEventListener('keydown', onKey); m.remove(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(false); };
    document.addEventListener('keydown', onKey);
    $('.x', m).onclick = () => close(false);
    const c = $('[data-c]', m); if (c) c.onclick = () => close(false);
    const o = $('[data-o]', m);
    if (o) o.onclick = async () => {
      try { if (onOk && (await onOk(b)) === false) return; close(true); }
      catch (e) { console.error(e); toast(e.message || String(e), 'err'); }
    };
    document.body.appendChild(m);
    const f = $('input,select,textarea', b); if (f) f.focus();
  });
}
const confirmBox = (msg, ok = '確定') => modal({ title: '確認', body: `<p>${esc(msg)}</p>`, ok });
function download(name, content, mime = 'application/octet-stream') {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = safeName(name);
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
/* CSV：加 BOM；字串若以 = + - @ 開頭（且不是純數字）前置單引號，避免 Excel 把它當公式執行 */
function toCSV(rows, cols) {
  const q = v => {
    v = v ?? '';
    if (typeof v === 'string' && /^[=+\-@\t\r]/.test(v) && toNum(v) == null) v = "'" + v;
    v = String(v); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  };
  return '\uFEFF' + [cols.map(c => q(c.label)).join(','), ...rows.map(r => cols.map(c => q(typeof c.get === 'function' ? c.get(r) : r[c.key])).join(','))].join('\r\n');
}
function toExcelXML(sheets) {
  const x = s => esc(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/\n/g, '&#10;');
  const cell = v => (typeof v === 'number' && isFinite(v)) ? `<Cell><Data ss:Type="Number">${v}</Data></Cell>` : `<Cell><Data ss:Type="String">${x(v ?? '')}</Data></Cell>`;
  const ws = sheets.map(s => `<Worksheet ss:Name="${x(String(s.name).replace(/[\\/?*\[\]:]/g, '_').slice(0, 31))}"><Table>
<Row>${s.cols.map(c => `<Cell ss:StyleID="h"><Data ss:Type="String">${x(c.label)}</Data></Cell>`).join('')}</Row>
${s.rows.map(r => `<Row>${s.cols.map(c => cell(typeof c.get === 'function' ? c.get(r) : r[c.key])).join('')}</Row>`).join('\n')}
</Table></Worksheet>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#8A1538" ss:Pattern="Solid"/></Style></Styles>
${ws}</Workbook>`;
}
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const b64ToBlob = d => { const [h, b] = d.split(','), bin = atob(b), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: (h.match(/data:([^;]*)/) || [])[1] || '' }); };
const readText = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f, 'utf-8'); });
function barChart(data, { width = 560, barH = 22, color = '#8a1538', fmt = v => fmtN(v), max: fixedMax } = {}) {
  if (!data.length) return '<div class="empty">無資料</div>';

  const rows = Math.max(...cols.map(c => c.length), 1);
  const W = PAD * 2 + cols.length * NW + (cols.length - 1) * GX + STUB, H = HEAD + rows * (NH + GY) + PAD;
  const colLabel = (c, k) => (hasOrphan && k === cols.length - 1 && !c.some(x => depth.has(x.id))) ? '孤立（未被結論引用）' :
    '第 ' + (k + 1) + ' 層・' + [...new Set(c.map(x => TYPES[x.type].label))].join('／');
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" ${fit ? 'width="100%"' : `width="${W}" height="${H}"`} font-family="Microsoft JhengHei,PingFang TC,sans-serif">`;
  cols.forEach((c, k) => { svg += `<text x="${PAD + k * (NW + GX)}" y="20" font-size="12" fill="#777" font-weight="bold">${esc(colLabel(c, k))}</text>`; });
  links.forEach(l => {
    const a = pos.get(l.fromId), b = pos.get(l.toId); if (!a || !b) return;
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, dx = Math.max(36, Math.abs(x2 - x1) / 2);
    svg += `<path class="edge" data-f="${esc(l.fromId)}" data-t="${esc(l.toId)}" d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}"><title>${esc(REL[l.relation] || '')}</title></path>`;
  });
  nodes.forEach(x => {
    if (x.type !== 'data' && x.type !== 'evidence' && (an.adj.out.get(x.id) || []).length === 0) {
      const p = pos.get(x.id), y = p.y + NH / 2;
      svg += `<g class="stub" data-f="${esc(x.id)}"><line x1="${p.x + NW}" y1="${y}" x2="${p.x + NW + 34}" y2="${y}" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4"/><text x="${p.x + NW + 36}" y="${y + 5}" font-size="16" fill="#c62828" font-weight="bold">✕</text></g>`;
    }
  });
  nodes.forEach(x => {
    const p = pos.get(x.id), T = TYPES[x.type], iss = an.issues.get(x.id) || [];
    const errN = iss.filter(i => i.level === 'err').length, warnN = iss.filter(i => i.level === 'warn').length;
    const val = (x.type !== 'claim' && x.type !== 'evidence' && toNum(x.value) != null) ? fmtV(toNum(x.value)) + (x.unit ? ' ' + x.unit : '') : (x.type === 'evidence' ? (x.refPath ? '🔗 ' + trunc(x.refPath, 14) : (ctx.atts.some(a => a.nodeId === x.id) ? '📎 附件' : '（空）')) : '');
    svg += `<g class="mnode" data-id="${esc(x.id)}" transform="translate(${p.x},${p.y})"><title>${esc(x.code + ' ' + x.title + (iss.length ? '\n' + iss.map(i => '• ' + i.msg).join('\n') : ''))}</title>
      <rect class="bx" width="${NW}" height="${NH}" rx="8" fill="${T.bg}" stroke="${errN ? '#c62828' : T.color}" stroke-width="${errN ? 3 : 1.5}"${iss.some(i => i.rule === 'R4') ? ' stroke-dasharray="6 4"' : ''}/>
      <rect width="6" height="${NH}" rx="3" fill="${T.color}"/>
      <text x="14" y="19" font-size="12" font-weight="bold" fill="${T.color}">${T.icon} ${esc(x.code)}</text>
      <text x="14" y="38" font-size="13" fill="#222">${esc(trunc(x.title, 13))}</text>
      <text x="14" y="55" font-size="11" fill="#666">${esc(val)}</text>
      ${x.reviewStatus === 'pass' ? `<text x="${NW - 10}" y="55" font-size="12" fill="#2e7d32" text-anchor="end">✔</text>` : ''}
      ${errN ? `<circle cx="${NW - 12}" cy="12" r="9" fill="#c62828"/><text x="${NW - 12}" y="16" font-size="11" fill="#fff" text-anchor="middle">${errN}</text>` : (warnN ? `<circle cx="${NW - 12}" cy="12" r="9" fill="#e59a1c"/><text x="${NW - 12}" y="16" font-size="11" fill="#fff" text-anchor="middle">${warnN}</text>` : '')}
    </g>`;
  });
  return svg + '</svg>';
}
function mapHighlight(root, an, id) {
  const ns = $$('.mnode', root), es = $$('.edge', root), ss = $$('.stub', root);
  if (!id) { [...ns, ...es, ...ss].forEach(e => e.classList.remove('dim', 'hl', 'hl2')); return; }
  const up = an.reachOut(id), down = reachFrom(an.adj.inn, id), keep = new Set([id, ...up, ...down]);
  ns.forEach(e => e.classList.toggle('dim', !keep.has(e.dataset.id)));
  es.forEach(e => {
    const f = e.dataset.f, t = e.dataset.t;
    const inUp = (f === id || up.has(f)) && up.has(t), inDown = (t === id || down.has(t)) && down.has(f);
    e.classList.toggle('hl', inUp); e.classList.toggle('hl2', inDown && !inUp); e.classList.toggle('dim', !(inUp || inDown));
  });
  ss.forEach(e => e.classList.toggle('dim', !keep.has(e.dataset.f)));
}

async function copyCaseData(id) {

    nodes.forEach(n => t.objectStore('nodes').put({ ...n, id: idm.get(n.id), caseId: nid, datasetId: n.datasetId ? dm.get(n.datasetId) || '' : '', reviewStatus: 'unreviewed', reviewedAt: null, updatedAt: t0 }));
    links.forEach(l => t.objectStore('links').put({ ...l, id: uid(), caseId: nid, fromId: idm.get(l.fromId), toId: idm.get(l.toId) }));

function defRel(from, to) { if (to.type === 'evidence') return 'supported_by'; if (from.type === 'number' || from.type === 'data') return 'derived_from'; return 'references'; }
async function addLink(ctx, fromId, toId, relation) {
  if (fromId === toId) { toast('不能連到自己', 'err'); return false; }
  if (ctx.links.some(l => l.fromId === fromId && l.toId === toId)) { toast('此連結已存在', 'err'); return false; }
  await DB.put('links', { id: uid(), caseId: ctx.c.id, fromId, toId, relation });
  const loop = reachFrom((() => { const m = new Map(ctx.nodes.map(n => [n.id, []])); [...ctx.links, { fromId, toId }].forEach(l => m.get(l.fromId)?.push(l.toId)); return m; })(), toId).has(fromId);
  if (loop) toast('已建立，但此連結形成循環引用（R6）', 'err'); else toast('已新增連結', 'ok');
  return true;
}

/* 搜尋框：中文輸入法組字期間不重繪，組字完成才套用（否則會打斷注音／倉頡輸入） */
function bindQ(app, sel, obj, key) {
  const qi = $(sel, app); if (!qi) return;
  const fire = () => { obj[key] = qi.value; clearTimeout(qi._t); qi._t = setTimeout(async () => { await refresh(); const n = $(sel); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 250); };
  qi.addEventListener('compositionstart', () => { qi._comp = true; clearTimeout(qi._t); });
  qi.addEventListener('compositionend', () => { qi._comp = false; fire(); });
  qi.addEventListener('input', e => { if (qi._comp || e.isComposing) return; fire(); });
}

function bindNodeDetail(app, ctx, an, n) {
  const nd = $('#nd', app), nl = $('#nl', app);
  $('#nd-impact', nd).onclick = () => showImpact(ctx, an, n);
  $('#nd-del', nd).onclick = async () => {
    if (!await confirmBox(`確定刪除節點 ${n.code}？相關連結、覆核紀錄與附件將一併刪除。`, '刪除')) return;
    await deleteNodeData(ctx, n.id); State.sel = null; toast('已刪除節點', 'ok'); refresh();
  };
  const tryBtn = $('#nd-try', nd);
  if (tryBtn) tryBtn.onclick = () => {
    const f = $('[name=formula]', nd).value, out = $('#nd-try-out', nd);
    try { const v = evalFormula(f, r => { const t = an.codeMap.get(String(r).toUpperCase()); if (!t) throw new Error('找不到節點代號 {' + r + '}'); return an.evalNode(t, [n.id]); }); out.innerHTML = `<span style="color:var(--ok)">= ${esc(fmtV(v))}</span>`; }
    catch (e) { out.innerHTML = `<span style="color:var(--err)">${esc(e.message)}</span>`; }
  };
  $('#nd-save', nd).onclick = async () => {
    const g = k => nd.querySelector(`[name=${k}]`);
    const fresh = await DB.get('nodes', n.id); const before = JSON.stringify(fresh);
    const title = g('title').value.trim(); if (!title) return toast('請輸入標題', 'err');
    const code = g('code').value.trim();
    if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(code)) return toast('代號須以英文字母開頭，僅含英數字或底線', 'err');
    if (ctx.nodes.some(x => x.id !== n.id && x.code.toUpperCase() === code.toUpperCase())) return toast('代號已被其他節點使用', 'err');
    const oldCode = fresh.code, type = g('type').value;
    const next = { ...fresh, type, code, title, content: g('content').value.trim() };
    if (g('value')) {
      const raw = g('value').value.trim();
      if (raw !== '' && toNum(raw) == null) return toast('數值欄位請輸入數字（可含千分位逗號）', 'err');
      const tl = g('tolerance').value.trim(); if (tl !== '' && (toNum(tl) == null || toNum(tl) < 0)) return toast('容許誤差請輸入大於等於 0 的數字', 'err');
      next.value = raw === '' ? '' : toNum(raw); next.unit = g('unit').value.trim(); next.tolerance = tl;
    }
    if (g('formula')) { const f = normFormula(g('formula').value).trim(); if (f) { try { parseFormula(f); } catch (e) { return toast('公式錯誤：' + e.message, 'err'); } } next.formula = f; }
    if (g('refPath')) next.refPath = g('refPath').value.trim();
    if (g('datasetId')) { const d = g('datasetId').value; if (d !== (fresh.datasetId || '')) next.src = null; next.datasetId = d; next.rowRef = g('rowRef').value.trim(); }
    const renamed = oldCode.toUpperCase() !== code.toUpperCase();
    const others = renamed ? ctx.nodes.filter(x => x.id !== n.id && normFormula(x.formula || '').includes('{')) : [];
    const rewrites = others.map(x => ({ id: x.id, old: x.formula, f: normFormula(x.formula).replace(/\{([^}]+)\}/g, (m, r) => r.trim().toUpperCase() === oldCode.toUpperCase() ? '{' + code + '}' : m) })).filter(x => x.f !== normFormula(x.old));
    const changed = JSON.stringify(next) !== before;
    if (!changed && !rewrites.length) return toast('沒有變更', '');
    if (changed) next.updatedAt = now();
    await DB.put('nodes', next);
    for (const r of rewrites) { const o = await DB.get('nodes', r.id); o.formula = r.f; o.updatedAt = now(); await DB.put('nodes', o); }
    // 公式引用的節點自動補上「引用」連結（不會自動刪除舊連結）
    if (next.type === 'calc' && next.formula) {
      const lks = await DB.byIndex('links', 'byCase', ctx.c.id);
      for (const ref of new Set(refsOf(next.formula))) {
        const t = ctx.nodes.find(x => x.code.toUpperCase() === ref.toUpperCase());
        if (t && t.id !== next.id && !lks.some(l => l.fromId === next.id && l.toId === t.id)) await DB.put('links', { id: uid(), caseId: ctx.c.id, fromId: next.id, toId: t.id, relation: 'references' });
      }
    }
    const deps = [...reachFrom(an.adj.inn, n.id)].map(id => an.byId.get(id)).filter(x => x && x.reviewStatus === 'pass');
    toast(deps.length ? `已儲存。受影響且已通過覆核的 ${deps.length} 個節點（${deps.map(x => x.code).join('、')}）已標示為「需重新覆核」` : '已儲存', 'ok');
    refresh();
  };
  $$('[data-dl]', nd).forEach(a => a.onclick = async e => { e.preventDefault(); const f = await DB.get('attachments', a.dataset.dl); if (f && f.blob) download(f.name, f.blob); else toast('找不到附件內容', 'err'); });
  $$('[data-rm]', nd).forEach(b => b.onclick = async () => { if (!await confirmBox('確定移除此附件？', '移除')) return; await DB.del('attachments', b.dataset.rm); await touchNode(n.id); refresh(); });
  $('#nd-file', nd).onchange = async e => {
    const all = [...e.target.files], fs = all.filter(f => f.size <= APP.maxAttach);
    if (fs.length !== all.length) toast(`${all.filter(f => f.size > APP.maxAttach).map(f => f.name).join('、')} 超過 ${Math.round(APP.maxAttach / 1048576)} MB，未加入；請改填「參考路徑」`, 'err');
    if (!fs.length) return;
    await DB.tx(['attachments'], t => fs.forEach(f => t.objectStore('attachments').put({ id: uid(), nodeId: n.id, caseId: ctx.c.id, name: f.name, type: f.type, size: f.size, blob: f, createdAt: now() })));
    await touchNode(n.id); toast(`已加入 ${fs.length} 個附件`, 'ok'); refresh();
  };
  $$('[data-rv]', nd).forEach(b => b.onclick = () => reviewDialog(ctx, n, b.dataset.rv));
  $$('[data-go]', nl).forEach(e => e.onclick = () => { State.sel = e.dataset.go; refresh(); });
  $$('[data-ul]', nl).forEach(b => b.onclick = async () => { await DB.del('links', b.dataset.ul); toast('已移除連結', 'ok'); refresh(); });
  $('#la-o-btn', nl).onclick = async () => { const t = $('#la-o', nl).value; if (!t) return toast('請選擇節點', 'err'); if (await addLink(ctx, n.id, t, $('#la-o-rel', nl).value)) refresh(); };
  $('#la-i-btn', nl).onclick = async () => { const f = $('#la-i', nl).value; if (!f) return toast('請選擇節點', 'err'); if (await addLink(ctx, f, n.id, $('#la-i-rel', nl).value)) refresh(); };
  const setDefRel = (selId, relId, dir) => { $(selId, nl).onchange = e => { const o = an.byId.get(e.target.value); if (o) $(relId, nl).value = dir === 'o' ? defRel(n, o) : defRel(o, n); }; };
  setDefRel('#la-o', '#la-o-rel', 'o'); setDefRel('#la-i', '#la-i-rel', 'i');
}

/* ---------- 資料匯入 ---------- */
function parseDelimited(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const d = first.includes('\t') ? '\t' : ',', rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"' && cur === '') q = true;
    else if (ch === d) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function buildDataset(text, hasHeader, name, caseId) {
  const raw = parseDelimited(text); if (raw.length < (hasHeader ? 2 : 1)) throw new Error('沒有可匯入的資料列');
  const w = Math.max(...raw.map(r => r.length));
  const grid = raw.map(r => Array.from({ length: w }, (_, i) => String(r[i] ?? '').trim()));
  let columns = hasHeader ? grid.shift().map((c, i) => c || '欄' + (i + 1)) : Array.from({ length: w }, (_, i) => '欄' + (i + 1));
  columns = columns.map((c, i) => columns.indexOf(c) === i ? c : c + '_' + (i + 1));
  // 數值欄判斷：前導 0（如戶號 00123）或 16 位以上長數字視為文字，避免被轉成數字而失真
  const numeric = columns.map((_, ci) => grid.every(r => r[ci] === '' || toNum(r[ci]) != null) && grid.some(r => r[ci] !== '') && !grid.some(r => /^[+-]?0\d|^\d{16,}$/.test(r[ci])));
  const rows = grid.map(r => r.map((v, ci) => numeric[ci] && v !== '' ? toNum(v) : v));
  return { id: uid(), caseId, name, columns, rows, importedAt: now() };
}

/* 匯入前驗證：id 只允許英數底線連字號（防止 HTML 注入）、類型／關係／狀態必須是已知值、必要欄位型別正確 */
function validateBackup(j) {
  const idRe = /^[A-Za-z0-9_-]+$/, idF = ['caseId', 'nodeId', 'fromId', 'toId', 'datasetId'];
  if (typeof j.version === 'number' && j.version > APP.dbVersion) throw new Error('備份檔來自較新版本的工具，請改用較新版');
  for (const s of DATA_STORES) {
    const arr = j.data[s]; if (arr == null) continue;
    if (!Array.isArray(arr)) throw new Error(`${s} 格式錯誤（應為陣列）`);
    arr.forEach((r, i) => {
      const at = `${s} 第 ${i + 1} 筆`;
      if (!r || typeof r !== 'object' || typeof r.id !== 'string' || !idRe.test(r.id)) throw new Error(`${at}的 id 不合法`);
      idF.forEach(f => { if (r[f] != null && r[f] !== '' && !(typeof r[f] === 'string' && idRe.test(r[f]))) throw new Error(`${at}的 ${f} 不合法`); });
      if (s === 'cases' && typeof r.name !== 'string') throw new Error(`${at}缺少名稱`);
      if (s === 'nodes') {
        if (typeof r.code !== 'string' || typeof r.title !== 'string') throw new Error(`${at}缺少代號或標題`);
        if (typeof r.type !== 'string' || !hasOwn(TYPES, r.type)) throw new Error(`${at}的類型不合法`);
        if (r.reviewStatus && !hasOwn(RSTAT, r.reviewStatus)) throw new Error(`${at}的覆核狀態不合法`);
      }
      if (s === 'links' && (typeof r.relation !== 'string' || !hasOwn(REL, r.relation))) throw new Error(`${at}的關係不合法`);
      if (s === 'reviews' && (typeof r.status !== 'string' || !hasOwn(RSTAT, r.status) || typeof r.at !== 'string')) throw new Error(`${at}的狀態或時間不合法`);
      if (s === 'datasets' && (!Array.isArray(r.columns) || !Array.isArray(r.rows))) throw new Error(`${at}的欄位或資料列格式錯誤`);
    });
  }
}
function pickImport(mode) {
  const inp = $('#file-import'); inp.value = '';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await readText(f));
      if (!j || !j.data || j.db !== APP.dbName) throw new Error('檔案格式不符（不是本工具匯出的 JSON）');
      validateBackup(j);
      if (mode === 'restore' && !await confirmBox('將先清空目前所有資料再匯入，確定？', '還原')) return;
      const rows = {};
      for (const s of DATA_STORES) rows[s] = (j.data[s] || []).map(r => typeof r.blob === 'string' && r.blob.startsWith('data:') ? { ...r, blob: b64ToBlob(r.blob) } : r);
      await DB.tx(DATA_STORES, t => DATA_STORES.forEach(s => { const os = t.objectStore(s); if (mode === 'restore') os.clear(); rows[s].forEach(r => os.put(r)); }));
      if (mode === 'restore' && j.settings && toNum(j.settings.tol) != null) await Meta.set('tol', toNum(j.settings.tol));
      toast(`匯入完成：${DATA_STORES.map(s => `${s} ${rows[s].length}`).join('、')}`, 'ok'); refresh();
    } catch (e) { console.error(e); toast('匯入失敗：' + e.message, 'err'); }
  };
  inp.click();
}

    mk('c2', 'claim', 'C2', '平均風險權數由 35.0% 上升至 68.0%', { content: '分類調整後，不動產暴險平均風險權數約由 35.0% 上升至 68.0%。' }),
    mk('n1', 'number', 'N1', '調整前 RWA 合計', { value: 924, unit: '百萬元', ...P }),
    mk('n2', 'number', 'N2', '調整後 RWA 合計', { value: 1742, unit: '百萬元', ...P }),
    mk('n3', 'number', 'N3', 'RWA 增加數', { value: 818, unit: '百萬元' }),
    mk('n4', 'number', 'N4', '不動產暴險總額', { value: 2640, unit: '百萬元', content: '（範例：此數字尚未標示來源）' }),
    mk('n5', 'number', 'N5', '調整後平均風險權數', { value: 68, unit: '%', reviewStatus: 'reject', reviewedAt: t1 }),
    mk('k1', 'calc', 'K1', 'RWA 增加數計算', { formula: '{N2} - {N1}', value: 818, unit: '百萬元' }),
    mk('k2', 'calc', 'K2', '平均風險權數計算', { formula: 'ROUND({N2}/{N4}*100,1)', value: 66, unit: '%', content: '調整後 RWA ÷ 暴險總額' }),
    mk('d1', 'data', 'D1', '資料集：調整前 RWA 合計', { datasetId: 's-ds1', src: { col: '調整前RWA', mode: 'sum', row: 1 }, value: 924, rowRef: '不動產暴險明細（範例）｜調整前RWA｜合計', ...P }),
    mk('d2', 'data', 'D2', '資料集：調整後 RWA 合計', { datasetId: 's-ds1', src: { col: '調整後RWA', mode: 'sum', row: 1 }, value: 1742, rowRef: '不動產暴險明細（範例）｜調整後RWA｜合計', ...P }),
    mk('e1', 'evidence', 'E1', '內部函文：分類調整核定', { refPath: '公文系統 文號（範例）', ...P }),
    mk('e2', 'evidence', 'E2', 'SQL 查詢結果', { content: '系統查詢 RWA 明細的結果檔', refPath: '\\\\檔案伺服器\\RWA\\查詢結果.xlsx（範例）', ...P }),
    mk('e3', 'evidence', 'E3', '主管簽核紀錄', { content: '（範例：尚未附件，也未填參考路徑）' })
  ];
  const lk = (a, b, r) => ({ id: `s-l-${a}-${b}`, caseId: C, fromId: 's-' + a, toId: 's-' + b, relation: r });
  const links = [lk('c1', 'n3', 'references'), lk('c1', 'e1', 'supported_by'), lk('c1', 'e3', 'supported_by'), lk('n3', 'k1', 'derived_from'), lk('k1', 'n1', 'references'), lk('k1', 'n2', 'references'),
    lk('n1', 'd1', 'derived_from'), lk('n2', 'd2', 'derived_from'), lk('d1', 'e2', 'supported_by'), lk('d2', 'e2', 'supported_by'),
    lk('c2', 'n5', 'references'), lk('n5', 'k2', 'derived_from'), lk('k2', 'n2', 'references'), lk('k2', 'n4', 'references')];
  const rv = (n, status, comment, reviewer = '覆核主管') => ({ id: `s-r-${n}`, nodeId: 's-' + n, caseId: C, status, comment, reviewer, at: t1 });
  const reviews = [rv('e1', 'pass', '文號與內容核對無誤'), rv('e2', 'pass', '查詢條件與基準日一致'), rv('d1', 'pass', '合計與資料集重算相符'), rv('d2', 'pass', '合計與資料集重算相符'), rv('n1', 'pass', '與 D1 相符'), rv('n2', 'pass', '與 D2 相符'), rv('n5', 'reject', '與計算 K2 重算值不符，請更正數字或公式')];
  const att = { id: 's-a-e2', nodeId: 's-e2', caseId: C, name: '查詢結果_範例.txt', type: 'text/plain', size: 0, blob: new Blob(['範例佐證：SQL 查詢結果（模擬資料）\n調整前RWA 合計 924；調整後RWA 合計 1742'], { type: 'text/plain' }), createdAt: t2 };
  att.size = att.blob.size;
  await DB.tx(DATA_STORES, t => {
    t.objectStore('cases').put(cse); t.objectStore('datasets').put(ds);
    nodes.forEach(n => t.objectStore('nodes').put(n)); links.forEach(l => t.objectStore('links').put(l));
    reviews.forEach(r => t.objectStore('reviews').put(r)); t.objectStore('attachments').put(att);
  });
  await setCase(C); toast('已載入範例資料', 'ok');
  if (location.hash.slice(1) === 'map') refresh(); else location.hash = 'map';
}

/* ---------- 使用說明 ---------- */
function renderHelp(app) {
  app.innerHTML = `<div class="card"><h2>使用說明</h2>
    <h3>這個工具做什麼？</h3><p>把報告中的<b>結論 → 數字 → 計算 → 原始資料 → 佐證附件</b>串成一條可追溯的鏈，並自動找出「沒有來源的數字」「算不平的計算」「沒有佐證的結論」。</p>
    <h3>五種節點</h3><p>${Object.values(TYPES).map(t => `${t.icon} <b>${t.label}</b>`).join('　')}。每個節點有代號（C1、N1、K1、D1、E1…），公式用 <span class="mono">{N1}</span> 引用。</p>
    <h3>快速上手</h3><ol>
      <li>到「資料管理」按「載入範例資料」，先看「⭐ 佐證鏈地圖」的效果。</li>
      <li>「查核案件」新增案件（名稱、基準日、承辦、覆核者、截止日）。</li>
      <li>「節點工作台」新增結論，再逐層新增數字、計算、資料、佐證；在右側「連結」把它們串起來（方向：下游 → 上游）。</li>
      <li>需要原始明細時，到「資料匯入」貼上 Excel 表格，再「建立資料節點」，系統會記住來源欄位並自動重算。</li>
      <li>在「數字核驗」確認計算相符；在「覆核」逐節點通過／補件／退回；在「缺證清單」一鍵產生補件通知信。</li>
      <li>「查核報告」可列印或另存 PDF（A4）。</li></ol>
    <h3>健康度規則</h3><table class="grid"><tbody>${Object.entries(RULES).map(([k, v]) => `<tr><td class="mono">${k}</td><td>${tagHtml(v.label, v.level)}</td><td>${{ R0: '結論沒有任何路徑連到資料或佐證', R1: '數字沒有任何上游來源', R2: '重算值與宣稱值差異超過容許誤差，或資料集重算不符', R3: '佐證沒有附件，也沒有參考路徑', R4: '節點未被任何結論引用', R5: '節點或其上游在覆核通過後被修改', R6: '連結形成循環', RV: '覆核結果為退回或需補件' }[k]}</td></tr>`).join('')}</tbody></table>
    <h3>公式</h3><p>可用數字、<span class="mono">{代號}</span>、<span class="mono">+ - * / ( )</span>，以及 <span class="mono">SUM</span>、<span class="mono">ROUND</span>、<span class="mono">ABS</span>。例：<span class="mono">ROUND({N2}/{N4}*100,1)</span>。全形的括號、逗號與運算符號會自動轉半形；ROUND 採四捨五入（與 Excel 一致）。系統以安全解析器計算，不執行任何程式碼。</p>
    <h3>資料保存</h3><p>資料存在本機瀏覽器 IndexedDB，不會上傳。請勿使用無痕模式，並定期到「資料管理」匯出 JSON 備份；換電腦請用「還原備份」。Esc 可關閉對話框。匯出的 .xls 以 Excel 開啟時若出現格式提示，選「是」即可。</p></div>`;
}

/* =====================================================================
 * 8. 啟動
 * ===================================================================*/
(async function boot() {
  try { await DB.open(); }
  catch (e) {
    $('#app').innerHTML = `<div class="card"><h2>無法開啟 IndexedDB</h2><p>${esc(e.message || e)}</p><p>請勿使用無痕（InPrivate）模式，或洽資訊人員確認瀏覽器是否封鎖本機儲存。</p></div>`;
    return;
  }
  try { await navigator.storage?.persist?.(); } catch { }
  State.case = await Meta.get('currentCase', null);
  $('#tb-import').onclick = () => pickImport('merge');
  $('#tb-export').onclick = exportAll;
  $('#tb-print').onclick = printReport;
  $('#case-sel').onchange = async e => { await setCase(e.target.value || null); refresh(); };
  const last = location.hash.slice(1) || await Meta.get('lastPage', 'dash');
  if (location.hash.slice(1) !== last) location.hash = last; else go(last);
})();
window.addEventListener('error', e => toast('錯誤：' + e.message, 'err'));
window.addEventListener('unhandledrejection', e => toast('錯誤：' + (e.reason?.message || e.reason), 'err'));
</script>
</body>
